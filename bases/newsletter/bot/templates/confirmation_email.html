<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml"
    xmlns:o="urn:schemas-microsoft-com:office:office">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title>Подтверждение email | телеграФЪ</title>
    <style>
        body,
        table,
        td,
        a {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        table,
        td {
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }

        img {
            -ms-interpolation-mode: bicubic;
            border: 0;
            height: auto;
            line-height: 100%;
            outline: none;
            text-decoration: none;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100% !important;
            height: 100% !important;
        }

        @media (prefers-color-scheme: dark) {
            .email-bg {
                background-color: #1A1714 !important;
            }

            .body-bg {
                background-color: #252220 !important;
            }

            .text-primary {
                color: #F5F0E8 !important;
            }

            .text-secondary {
                color: #D9D0C3 !important;
            }

            .border-light {
                border-color: #3A3632 !important;
            }

            .code-box {
                background-color: #1A1714 !important;
                border-color: #8B7355 !important;
            }
        }

        @media screen and (max-width: 600px) {
            .container {
                width: 100% !important;
            }

            .mobile-padding {
                padding-left: 16px !important;
                padding-right: 16px !important;
            }
        }
    </style>
</head>

<body style="margin:0; padding:0; background-color:#EDE7DB; font-family:Arial, Helvetica, sans-serif;" class="email-bg">

    <div style="display:none; max-height:0; overflow:hidden; mso-hide:all;">
        Ваш код подтверждения: {{ code }}&#8199;&#65279;&#847; &#8199;&#65279;&#847; &#8199;&#65279;&#847;
    </div>

    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#EDE7DB;"
        class="email-bg">
        <tr>
            <td align="center" style="padding:24px 8px;">

                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" class="container"
                    style="max-width:600px; width:100%;">

                    <tr>
                        <td style="background-color:#1A1714; padding:0;">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                                <tr>
                                    <td style="padding:18px 28px;" valign="middle">
                                        <span
                                            style="font-family:Georgia,'Times New Roman',serif; font-size:20px; font-weight:bold; letter-spacing:0.03em;">
                                            <span style="color:#F5F0E8;">телегра</span><span
                                                style="color:#B8943E;">ФЪ</span>
                                        </span>
                                    </td>
                                    <td align="right" style="padding:18px 28px;" valign="middle">
                                        <span
                                            style="font-family:'Courier New',Courier,monospace; font-size:9px; letter-spacing:0.15em; text-transform:uppercase; color:#8B7355;">
                                            ВЕРИФИКАЦИЯ
                                        </span>
                                    </td>
                                </tr>
                            </table>
                            <div style="height:1px; background-color:#8B7355; opacity:0.3;"></div>
                        </td>
                    </tr>

                    <tr>
                        <td style="background-color:#F5F0E8; padding:20px 28px 18px;" class="mobile-padding">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                                <tr>
                                    <td>
                                        <div
                                            style="font-family:Georgia,'Times New Roman',serif; font-size:18px; font-weight:bold; color:#1A1714;">
                                            Подтверждение email
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:0 28px;" class="mobile-padding">
                            <div style="height:1px; background-color:#D9D0C3;" class="border-light"></div>
                        </td>
                    </tr>

                    <tr>
                        <td style="background-color:#FAFAF6; padding:40px 28px;" class="mobile-padding body-bg">

                            <p style="font-family:Arial,Helvetica,sans-serif; font-size:16px; line-height:1.7; color:#3A3632; margin:0 0 24px; text-align: center;"
                                class="text-secondary">
                                Ваш код подтверждения:
                            </p>

                            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                                <tr>
                                    <td align="center">
                                        <div style="background-color:#EDE7DB; border:1px solid #D9D0C3; padding:16px 32px; display:inline-block; border-radius:4px;"
                                            class="code-box border-light">
                                            <span
                                                style="font-family:'Courier New',Courier,monospace; font-size:32px; font-weight:bold; letter-spacing:8px; color:#1A1714;"
                                                class="text-primary">
                                                {{ code }}
                                            </span>
                                        </div>
                                    </td>
                                </tr>
                            </table>

                        </td>
                    </tr>

                    <tr>
                        <td style="background-color:#FAFAF6; padding:0 28px;" class="mobile-padding body-bg">
                            <div style="border-top:2px solid #1A1714; padding-top:5px;" class="border-light">
                                <div style="border-top:1px solid #D9D0C3;" class="border-light"></div>
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <td style="background-color:#1A1714; padding:28px 28px 20px;" class="mobile-padding">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td valign="middle" style="padding-right:10px;">
                                        <span
                                            style="font-family:Georgia,'Times New Roman',serif; font-size:18px; font-weight:bold; color:#B8943E;">ФЪ</span>
                                    </td>
                                    <td valign="middle">
                                        <span
                                            style="font-family:'Courier New',Courier,monospace; font-size:9px; letter-spacing:0.1em; text-transform:uppercase; color:#8B7355;">
                                            СИСТЕМНОЕ СООБЩЕНИЕ
                                        </span>
                                    </td>
                                </tr>
                            </table>

                            <p
                                style="font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:1.6; color:#D9D0C3; margin:16px 0;">
                                Если вы не запрашивали этот код, просто проигнорируйте это письмо. Возможно, кто-то
                                ошибся при вводе адреса электронной почты.
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>

</body>

</html>
