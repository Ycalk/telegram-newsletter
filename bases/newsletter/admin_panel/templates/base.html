<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Telegram Newsletter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <style>
        .htmx-indicator {
            display: none;
        }

        .htmx-request .htmx-indicator {
            display: inline;
        }

        .htmx-request.htmx-indicator {
            display: inline;
        }
    </style>
</head>

<body class="bg-gray-100 h-screen overflow-hidden text-gray-800">
    {% block content %}{% endblock %}
    <script>
        function formatUtcTimestamps(root) {
            (root || document).querySelectorAll('time[data-utc]').forEach(el => {
                const ts = parseInt(el.dataset.utc, 10);
                if (!isNaN(ts)) {
                    const d = new Date(ts * 1000);
                    el.textContent = d.toLocaleString('ru-RU', {
                        day: '2-digit', month: '2-digit', year: 'numeric',
                        hour: '2-digit', minute: '2-digit'
                    });
                }
            });
        }
        document.addEventListener('DOMContentLoaded', () => formatUtcTimestamps());
        document.addEventListener('htmx:afterSwap', e => formatUtcTimestamps(e.detail.target));
    </script>
</body>

</html>
