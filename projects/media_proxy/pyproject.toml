[tool.poetry]
name = "media_proxy"
version = "0.1.0"

authors = ["ycalk <alosev752@gmail.com>"]
license = ""

packages = [
    {include = "newsletter/media_proxy",from = "../../bases"},
    {include = "newsletter/logging",from = "../../components"},
    {include = "newsletter/dto",from = "../../components"},
    {include = "newsletter/api_client",from = "../../components"},
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
pydantic-settings = "^2.13.1"
fastapi = {extras = ["standard"], version = "^0.135.1"}
dishka = {extras = ["fastapi"], version = "^1.9.1"}
structlog = "^25.5.0"
opentelemetry-api = "^1.40.0"
opentelemetry-sdk = "^1.40.0"
opentelemetry-exporter-otlp = "^1.40.0"
opentelemetry-instrumentation-fastapi = "^0.61b0"
httpx = "^0.28.1"
hishel = {extras = ["httpx"], version = "^1.1.9"}
pillow = "^12.1.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
